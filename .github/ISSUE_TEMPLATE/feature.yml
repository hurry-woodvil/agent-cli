name: Feature
description: 新機能を追加する
title: "[Feature] "
labels:
  - feature

body:
  - type: textarea
    id: overview
    attributes:
      label: 概要
      description: どのような機能か
      placeholder: |
        CLIからLLMへ質問できるようにする
    validations:
      required: true

  - type: textarea
    id: user-value
    attributes:
      label: 誰が何をできるようになるか
      description: ユーザー価値を書く
      placeholder: |
        ユーザーがCLI経由でLLMへ質問し、回答を取得できるようにする
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: なぜ必要か
      placeholder: |
        AIエージェントとして自然言語応答を実現するため
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: スコープ
      description: このFeatureで扱う範囲
      placeholder: |
        - OpenAI API呼び出し
        - CLIからの入力連携
        - レスポンス表示

  - type: textarea
    id: out-of-scope
    attributes:
      label: スコープ外
      description: このFeatureで扱わない範囲
      placeholder: |
        - 会話履歴管理
        - Tool実行
        - テストコード実装
        
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 完了条件
      description: 何をもって完了とするか
      placeholder: |
        - CLIからLLMへ質問できる
        - LLMの回答を標準出力できる
        - READMEに実行手順が記載される

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 参考情報や設計メモなど
